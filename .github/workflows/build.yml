name: build

# 按需编译 sub2api(后端内嵌前端,单二进制产物),产物上传 artifact。
# 用法: Actions -> build -> Run workflow (选择分支) ;或 push 到 feat/* 分支自动触发。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要编译的分支(默认当前分支)'
        required: false
        default: ''
  push:
    branches: ['feat/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || '' }}

      # ---- 前端(必须先 build:产物 backend/internal/web/dist 会被 Go embed 进二进制) ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      # ---- 后端(内嵌上述前端产物) ----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build backend
        run: |
          cd backend
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/server ./cmd/server
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp backend/bin/server dist/sub2api-server
          cp -r backend/internal/web/dist dist/frontend-dist
          tar -czf dist/sub2api-build.tar.gz -C dist sub2api-server
          ls -lh dist/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-server
          path: dist/sub2api-server
      - name: Upload full build
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-build
          path: dist/sub2api-build.tar.gz
